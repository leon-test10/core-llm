        boundary_x: vacuum
        boundary_y: vacuum

    - id: register_materials
      skill: material_registry
      input:
        materials:
          fuel_inner: { name: "Inner Fuel", xs_provider: constant_2g }
          fuel_outer: { name: "Outer Fuel", xs_provider: constant_2g }
          reflector: { name: "Reflector", xs_provider: constant_2g }

    - id: xs_provider
      skill: constant_xs
      input:
        materials_xs:
          fuel_inner:
            D: [1.5, 0.4]
            Sigma_a: [0.010, 0.085]
            nuSigma_f: [0.006, 0.120]
            Sigma_s: [[0.0, 0.020], [0.0, 0.0]]
            chi: [1.0, 0.0]
            kappaSigma_f: [1.0, 1.0]
          fuel_outer:
            D: [1.5, 0.4]
            Sigma_a: [0.010, 0.080]
            nuSigma_f: [0.006, 0.110]
            Sigma_s: [[0.0, 0.020], [0.0, 0.0]]
            chi: [1.0, 0.0]
            kappaSigma_f: [1.0, 1.0]
          reflector:
            D: [1.3, 0.3]
            Sigma_a: [0.0, 0.015]
            nuSigma_f: [0.0, 0.0]
            Sigma_s: [[0.0, 0.040], [0.0, 0.0]]
            chi: [0.0, 0.0]
            kappaSigma_f: [0.0, 0.0]
        group_count: 2

    - id: solve
      skill: steady_diffusion_solver
      input:
        mesh: "{{ build_mesh.mesh }}"
        xs_provider: "{{ xs_provider.xs_provider }}"
        mode: two_group
        tolerance: 1.0e-10
        max_iter: 2000

    - id: compare
      skill: benchmark_compare
      input:
        result: "{{ solve.result }}"
        benchmark: "IAEA 2D PWR"
        ref_keff: 1.029
        tolerance_pcm: 5000

    - id: report
      skill: report_writer
      input:
        result: "{{ solve.result }}"
        mesh: "{{ build_mesh.mesh }}"
        case_name: benchmark_iaea2d
        output_dir: outputs

  outputs:
    - "{{ solve.keff }}"
    - "{{ compare.summary }}"
