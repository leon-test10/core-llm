  - id: register_materials
    skill: material_registry
    input:
      materials:
        fuel:
          name: UO2 Fuel
          xs_provider: constant_1g
        moderator:
          name: Light Water
          xs_provider: constant_1g
        reflector:
          name: Reflector
          xs_provider: constant_1g
  - id: xs_provider
    skill: constant_xs
    input:
      materials_xs:
        fuel:
          D: 1.4
          Sigma_a: 0.008
          nuSigma_f: 0.012
          kappaSigma_f: 1.0
        moderator:
          D: 2.0
          Sigma_a: 0.001
          nuSigma_f: 0.0
          kappaSigma_f: 0.0
        reflector:
          D: 1.8
          Sigma_a: 0.002
          nuSigma_f: 0.0
          kappaSigma_f: 0.0
      group_count: 1
  - id: solve
    skill: steady_diffusion_solver
    input:
      mesh: '{{ build_mesh.mesh }}'
      xs_provider: '{{ xs_provider.xs_provider }}'
      mode: one_group
      tolerance: 1.0e-10
      max_iter: 1000
  - id: report
    skill: report_writer
    input:
      result: '{{ solve.result }}'
      mesh: '{{ build_mesh.mesh }}'
      case_name: critical_core_demo
      output_dir: outputs
  outputs:
  - '{{ solve.keff }}'
  - '{{ solve.iterations }}'
