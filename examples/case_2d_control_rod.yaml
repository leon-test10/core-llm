# Example: 2D core with control rod inserted
# Same geometry as case_2d_fixed, but with a control rod in the center.

case:
  name: simple_2d_control_rod
  physics: one_group_diffusion

mesh:
  type: regular_2d
  nx: 10
  ny: 10
  dx: 1.0
  dy: 1.0

materials:
  fuel:
    xs_provider: constant_1g
    D: 1.2
    Sigma_a: 0.010
    nuSigma_f: 0.014
    kappaSigma_f: 1.0
  moderator:
    xs_provider: constant_1g
    D: 2.0
    Sigma_a: 0.001
    nuSigma_f: 0.0
    kappaSigma_f: 0.0
  control_rod:
    xs_provider: constant_1g
    D: 0.8
    Sigma_a: 0.080
    nuSigma_f: 0.0
    kappaSigma_f: 0.0
  reflector:
    xs_provider: constant_1g
    D: 1.8
    Sigma_a: 0.002
    nuSigma_f: 0.0
    kappaSigma_f: 0.0

layout:
  material_map:
    - [reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector]
    - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
    - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
    - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
    - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
    - [reflector, moderator, moderator, fuel,      fuel,      control_rod, fuel,   moderator, moderator, reflector]
    - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
    - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
    - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
    - [reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector]
