# Workflow: steady-state single-group diffusion
#
# This workflow:
#   1. Builds a 10x10 regular 2D mesh with fuel in center
#   2. Registers materials (fuel, moderator, reflector)
#   3. Creates constant cross sections
#   4. Runs the 1-group diffusion eigenvalue solver
#   5. Postprocesses power distribution
#   6. Writes report
#
# Usage:
#   python -m src.cli run examples/workflow_steady_diffusion.yaml

workflow:
  name: steady_diffusion_demo

  steps:
    - id: build_mesh
      skill: mesh_builder
      input:
        type: regular_2d
        nx: 10
        ny: 10
        dx: 1.0
        dy: 1.0
        material_map:
          - [reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector]
          - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
          - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
          - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
          - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
          - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
          - [reflector, moderator, moderator, fuel,      fuel,      fuel,      fuel,      moderator, moderator, reflector]
          - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
          - [reflector, moderator, moderator, moderator, moderator, moderator, moderator, moderator, moderator, reflector]
          - [reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector, reflector]
        boundary_x: vacuum
        boundary_y: vacuum

    - id: register_materials
      skill: material_registry
      input:
        materials:
          fuel:
            name: "UO2 Fuel (toy)"
            xs_provider: constant_1g
          moderator:
            name: "Light Water (toy)"
            xs_provider: constant_1g
          control_rod:
            name: "B4C Control Rod (toy)"
            xs_provider: constant_1g
          reflector:
            name: "Reflector (toy)"
            xs_provider: constant_1g

    - id: xs_provider
      skill: constant_xs
      input:
        materials_xs:
          fuel:
            D: 1.2
            Sigma_a: 0.010
            nuSigma_f: 0.014
            kappaSigma_f: 1.0
          moderator:
            D: 2.0
            Sigma_a: 0.001
            nuSigma_f: 0.0
            kappaSigma_f: 0.0
          control_rod:
            D: 0.8
            Sigma_a: 0.080
            nuSigma_f: 0.0
            kappaSigma_f: 0.0
          reflector:
            D: 1.8
            Sigma_a: 0.002
            nuSigma_f: 0.0
            kappaSigma_f: 0.0
        group_count: 1

    - id: solve
      skill: steady_diffusion_solver
      input:
        mesh: "{{ build_mesh.mesh }}"
        xs_provider: "{{ xs_provider.xs_provider }}"
        mode: one_group
        tolerance: 1.0e-8
        max_iter: 500

    - id: postprocess
      skill: power_postprocess
      input:
        result: "{{ solve.result }}"
        mesh: "{{ build_mesh.mesh }}"
        normalize_power: 1.0

    - id: report
      skill: report_writer
      input:
        result: "{{ solve.result }}"
        mesh: "{{ build_mesh.mesh }}"
        case_name: steady_diffusion_demo
        output_dir: outputs

  outputs:
    - "{{ solve.keff }}"
    - "{{ postprocess.power_grid }}"
