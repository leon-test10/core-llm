    - id: register_materials
      skill: material_registry
      input:
        materials:
          core: { name: "Fast Reactor Core", xs_provider: constant_2g }
          blanket: { name: "Radial Blanket", xs_provider: constant_2g }
          reflector: { name: "Reflector", xs_provider: constant_2g }

    - id: xs_provider
      skill: constant_xs
      input:
        materials_xs:
          core:
            D: [1.4, 0.4]
            Sigma_a: [0.010, 0.080]
            nuSigma_f: [0.006, 0.120]
            Sigma_s: [[0.0, 0.020], [0.0, 0.0]]
            chi: [1.0, 0.0]
            kappaSigma_f: [1.0, 1.0]
          blanket:
            D: [1.4, 0.4]
            Sigma_a: [0.005, 0.040]
            nuSigma_f: [0.0, 0.0]
            Sigma_s: [[0.0, 0.020], [0.0, 0.0]]
            chi: [0.0, 0.0]
            kappaSigma_f: [0.0, 0.0]
          reflector:
            D: [1.2, 0.3]
            Sigma_a: [0.001, 0.010]
            nuSigma_f: [0.0, 0.0]
            Sigma_s: [[0.0, 0.030], [0.0, 0.0]]
            chi: [0.0, 0.0]
            kappaSigma_f: [0.0, 0.0]
        group_count: 2

    - id: solve
      skill: steady_diffusion_solver
      input:
        mesh: "{{ build_mesh.mesh }}"
        xs_provider: "{{ xs_provider.xs_provider }}"
        mode: two_group
        tolerance: 1.0e-10
        max_iter: 2000

    - id: compare
      skill: benchmark_compare
      input:
        result: "{{ solve.result }}"
        benchmark: takeda1
        ref_keff: 0.9779
        tolerance_pcm: 500

    - id: report
      skill: report_writer
      input:
        result: "{{ solve.result }}"
        mesh: "{{ build_mesh.mesh }}"
        case_name: benchmark_takeda1
        output_dir: outputs

  outputs:
    - "{{ solve.keff }}"
    - "{{ compare.comparison }}"
