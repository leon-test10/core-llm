# Workflow: Takeda Model 1 benchmark validation
#
# Runs the Takeda benchmark (quarter-core, 2-group, 2D)
# and compares with published reference keff.
#
# This is the SIMPLEST possible validation benchmark:
#   - 2 groups (fast + thermal)
#   - 3 materials (core, blanket, reflector)
#   - Quarter symmetry
#   - Published reference keff = 0.9779 (diffusion)
#
# Usage:
#   python -m src.cli run examples/benchmark_takeda1.yaml

